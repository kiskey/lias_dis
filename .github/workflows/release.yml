# LIAS & DIS CI/CD Pipeline
# Version: 1.3 - Rolling Latest Release Pipeline
name: Release

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
        app: [discovery-service, lias]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ${{ matrix.app }} for ${{ matrix.arch }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          cd apps/${{ matrix.app }}
          go build -ldflags="-s -w -X main.version=${SHORT_SHA}" -o ../../bin/${{ matrix.app }}-${{ matrix.arch }} ./cmd/${{ matrix.app }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.arch }}
          path: bin/${{ matrix.app }}-${{ matrix.arch }}

  release:
    name: Publish Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: |
            ## LIAS & DIS Rolling Build
            Automated production build generated from commit `${{ github.sha }}`.

            ### Built Artifacts
            - `discovery-service-amd64`
            - `discovery-service-arm64`
            - `lias-amd64`
            - `lias-arm64`
          prerelease: false
          make_latest: "true"
          files: bin/*
